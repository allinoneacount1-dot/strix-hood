<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Strix Hood">
  <defs>
    <linearGradient id="hoodEdge" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#E4FF4D"/>
      <stop offset="0.45" stop-color="#CCFF00"/>
      <stop offset="1" stop-color="#00E5A0"/>
    </linearGradient>
    <linearGradient id="hoodFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#161B08"/>
      <stop offset="1" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="beak" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#E4FF4D"/>
      <stop offset="1" stop-color="#00E5A0"/>
    </linearGradient>
  </defs>

  <!-- hood: pointed cowl with flared shoulders -->
  <path d="M100 5 L169 55 C177 101 162 137 137 158 L152 186 L119 155 L100 161 L81 155 L48 186 L63 158 C38 137 23 101 31 55 Z"
        fill="url(#hoodFill)" stroke="url(#hoodEdge)" stroke-width="9" stroke-linejoin="round"/>
  <!-- inner bevel highlight -->
  <path d="M100 21 L156 61 C162 99 149 129 128 147 M72 147 C51 129 38 99 44 61 L100 21"
        fill="none" stroke="#CCFF00" stroke-width="2.4" opacity=".38" stroke-linejoin="round"/>
  <!-- crown seam -->
  <path d="M100 24 L100 60" stroke="#CCFF00" stroke-width="2.2" opacity=".45"/>

  <!-- brows -->
  <path d="M56 62 L92 84 L84 92 L52 74 Z" fill="#CCFF00"/>
  <path d="M144 62 L108 84 L116 92 L148 74 Z" fill="#CCFF00"/>
  <!-- eyes: angular, alert -->
  <path d="M60 82 C72 74 86 78 92 90 C80 96 66 94 60 82 Z" fill="#E4FF4D"/>
  <path d="M140 82 C128 74 114 78 108 90 C120 96 134 94 140 82 Z" fill="#E4FF4D"/>
  <circle cx="76" cy="86" r="3.4" fill="#0A0A0F"/>
  <circle cx="124" cy="86" r="3.4" fill="#0A0A0F"/>

  <!-- beak: faceted gem -->
  <path d="M100 90 L114 106 L100 132 L86 106 Z" fill="url(#beak)"/>
  <path d="M100 90 L100 132 M86 106 L114 106" stroke="#0A0A0F" stroke-width="1.6" opacity=".5"/>

  <!-- circuit tracery -->
  <g fill="none" stroke="#CCFF00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M86 112 L64 112 L56 120 L44 120"/>
    <path d="M114 112 L136 112 L144 120 L156 120"/>
    <path d="M64 112 L64 132 L74 142"/>
    <path d="M136 112 L136 132 L126 142"/>
    <path d="M52 104 L60 104 L68 96"/>
    <path d="M148 104 L140 104 L132 96"/>
    <path d="M100 132 L100 158"/>
  </g>
  <g fill="#CCFF00">
    <circle cx="41" cy="120" r="5.4"/>
    <circle cx="159" cy="120" r="5.4"/>
    <circle cx="49" cy="104" r="4.6"/>
    <circle cx="151" cy="104" r="4.6"/>
    <circle cx="76" cy="145" r="4.6"/>
    <circle cx="124" cy="145" r="4.6"/>
    <circle cx="64" cy="112" r="2.8"/>
    <circle cx="136" cy="112" r="2.8"/>
  </g>
  <rect x="95.5" y="150" width="9" height="30" rx="3.5" fill="url(#beak)"/>
</svg>
