<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strix Hood — Admin</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- base reset ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; background: #0A0A0F; color: #F5F5F7; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  img, svg { max-width: 100%; height: auto; display: block; }
  /* ---------- grain overlay ---------- */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E %3Cfilter id='noise'%3E %3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E %3C/filter%3E %3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.03' /%3E %3C/svg%3E"); }
  /* ---------- custom cursor ---------- */
  #cur { width: 8px; height: 8px; background: #00C805; border-radius: 50%; position: fixed; pointer-events: none; mix-blend: difference; transition: width .15s, height .15s; z-index: 10000; }
  #cur:hover { width: 24px; height: 24px; }
  /* ---------- shell ---------- */
  .shell { width:100%; max-width:1280px; margin-inline:auto; padding-inline:clamp(20px,4vw,56px); }
  /* ---------- sidebar desktop ---------- */
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; border-right: 1px solid rgba(0,200,5,.1); backdrop-filter: blur(20px); padding: clamp(28px,6vw,48px) 0; }
  .sidebar .logo { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -.03em; color: #00C805; margin-bottom: 64px; display: block; }
  .logo .accent { color: #2EDA12; }
  .nav { display: flex; flex-direction: column; gap: 8px; }
  .nav-item { font-size: 14px; font-weight: 500; color: #8A8B9E; padding: 14px 20px; border-radius: 14px; transition: background .2s, color .2s; white-space: nowrap; }
  .nav-item:hover, .nav-item.active { background: rgba(0,200,5,.1); color: #00C805; }
  /* ---------- bottom nav mobile ---------- */
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: #0D1F0D; backdrop-filter: blur(20px); display: none; }
  .bottom-nav .nav { display: flex; gap: 0; }
  .bottom-nav .nav-item { flex: 1; padding: 14px 0; text-align: center; font-size: 12px; font-weight: 600; color: #8A8B9E; border-top: 1px solid rgba(255,255,255,.05); }
  .bottom-nav .nav-item:hover, .bottom-nav .nav-item.active { color: #00C805; border-color: #00C805; }
  /* ---------- view containers ---------- */
  .view { display: none; }
  .view.active { display: block; }
  /* ---------- status pill ---------- */
  .pill { display: inline-flex; align-items: gap: 6px; padding: 6px 12px; border-radius: 100px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .pill.live { background: rgba(0,200,5,.15); color: #00C805; border: 1px solid rgba(0,200,5,.3); }
  .pill.warning { background: rgba(255,153,0,.15); color: #FF9900; }
  .pill.error { background: rgba(255,80,0,.15); color: #FF5000; }
  /* ---------- glass card ---------- */
  .glass { background: rgba(13,31,13,.4); backdrop-filter: blur(20px); border: 1px solid rgba(0,200,5,.2); border-radius: 20px; padding: 32px; }
  /* ---------- table ---------- */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A8B9E; text-align: left; }
  th { color: #00C805; border-bottom: 1px solid rgba(0,200,5,.2); }
</style>
</head>
<body>
<div id="cur"></div>
<x-dc>
  <!-- sidebar desktop -->
  <div class="sidebar">
    <div class="logo"><span class="accent">STRIX</span> HOOD</div>
    <nav class="nav" role="navigation">
      <button class="nav-item active" data-view="overview">Overview</button>
      <button class="nav-item" data-view="registry">Registry</button>
      <button class="nav-item" data-view="treasury">Treasury</button>
      <button class="nav-item" data-view="security">Security</button>
      <button class="nav-item" data-view="tokenomics">Tokenomics</button>
    </nav>
  </div>
  <!-- bottom nav mobile -->
  <div class="bottom-nav">
    <div class="nav">
      <button class="nav-item active" data-view="overview">O</button>
      <button class="nav-item" data-view="registry">R</button>
      <button class="nav-item" data-view="treasury">T</button>
      <button class="nav-item" data-view="security">S</button>
      <button class="nav-item" data-view="tokenomics">K</button>
    </div>
  </div>
  <!-- template views -->
  <div class="view active" id="overview">
    <div class="shell">
      <h1>Admin Dashboard</h1>
      <p class="pill live">Live</p>
      <div id="overview-feed"></div>
      <div id="overview-metrics"></div>
    </div>
  </div>
  <div class="view" id="registry">
    <div class="shell">
      <h2>Agent Registry</h2>
      <div class="glass">
        <input type="text" id="registry-filter" placeholder="Search..." style="width:100%;padding:10px 14px;margin-bottom:12px;border:1px solid rgba(0,200,5,.2);border-radius:10px;background:#0D1F0D;color:#F5F5F7;font-family:'JetBrains Mono',monospace;font-size:12px;">
        <div id="registry-table"></div>
      </div>
    </div>
  </div>
  <div class="view" id="treasury">
    <div class="shell">
      <h2>Fee & Treasury</h2>
      <div class="glass" id="treasury-flow"></div>
    </div>
  </div>
  <div class="view" id="security">
    <div class="shell">
      <h2>Security Monitor</h2>
      <div class="glass" id="security-layers"></div>
    </div>
  </div>
  <div class="view" id="tokenomics">
    <div class="shell">
      <h2>Tokenomics</h2>
      <div class="glass" id="token-donut"></div>
      <p id="strx-price" style="margin-top:12px;font-size:12px;color:#8A8B9E;"></p>
    </div>
  </div>
</x-dc>

<script>
/* ---------- helper: set active view ---------- */
function setView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(view).classList.add('active');
  document.querySelectorAll('.sidebar .nav-item, .bottom-nav .nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
}
setView('overview');

/* ---------- wallet connect (shared from app.dc.html logic) ---------- */
let wallet = null;
const walletStatus = document.createElement('div');
walletStatus.style.cssText = 'position:fixed;top:20px;right:20px;background:#0A0A0F;padding:12px 16px;border-radius:12px;font-size:12px;color:#F5F5F7;display:none;z-index:10000;';
walletStatus.innerHTML = '<div id="wallet-connect" style="color:#00C805;font-weight:600;">Connect Wallet</div><div id="wallet-details" style="margin-top:8px;font-size:11px;color:#8A8B9E;"></div>';
document.body.appendChild(walletStatus);

async function connectWallet() {
  if (window.ethereum) {
    try {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      const addr = accounts[0];
      const r = await fetch('https://cloudflare-eth.com', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_getBalance', params: [addr, 'latest'] })
      });
      const j = await r.json();
      const balWei = parseInt(j.result, 16);
      const balEth = (balWei / 1e18).toFixed(4);
      wallet = { type: 'evm', addr: addr.slice(0,6)+'...'+addr.slice(-4), bal: balEth, chain: 'Ethereum' };
    } catch (e) { walletErr('Connection rejected'); return; }
  } else if (window.solana || window.phantom?.solana) {
    const sol = window.solana || window.phantom.solana;
    try { await sol.connect(); const addr = sol.publicKey.toString(); const r = await fetch('https://api.mainnet-beta.solana.com', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getBalance', params: [addr] }) }); const j = await r.json(); const balSol = j.result.value / 1e9; wallet = { type: 'solana', addr: addr.slice(0,6)+'...'+addr.slice(-4), bal: balSol.toFixed(4), chain: 'Solana' }; } catch (e) { walletErr('Connection rejected'); return; }
  } else { walletErr('No wallet detected. Install MetaMask or Phantom.'); return; }
  document.getElementById('wallet-details').innerHTML = `Address: <span style="color:#F5F5F7;">${wallet.addr}</span> · <span style="color:#00C805;">${wallet.chain}</span> · Balance: <span style="color:#2EDA12;">${wallet.bal} ${wallet.chain === 'Ethereum' ? 'ETH' : 'SOL'}</span>`;
  document.getElementById('wallet-connect').style.display = 'none';
  // listen
  if (window.ethereum) { window.ethereum.on('accountsChanged', accounts => { wallet = null; document.getElementById('wallet-details').style.display = 'none'; walletErr('Wallet disconnected'); }); }
  const sol = window.solana || window.phantom?.solana; if (sol?.on) { sol.on('disconnect', () => { wallet = null; document.getElementById('wallet-details').style.display = 'none'; walletErr('Wallet disconnected'); }); }
}
function walletErr(msg) { document.getElementById('wallet-details').innerHTML = `<span style="color:#FF5000;">${msg}</span>`; document.getElementById('wallet-status').style.display = 'block'; }
document.getElementById('wallet-connect').addEventListener('click', connectWallet);

/* ---------- CoinGecko fetch ---------- */
async function fetchPrices() {
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true');
    const j = await r.json();
    state.prices = { btc: j.bitcoin.usd, eth: j.ethereum.usd, sol: j.solana.usd, btcChg: j.bitcoin.usd_24h_change, ethChg: j.ethereum.usd_24h_change, solChg: j.solana.usd_24h_change };
    renderPrices();
  } catch(e) { /* keep last */ }
}
function renderPrices() {
  const p = state.prices;
  const html = `<div style="font-size:12px;color:#8A8B9E;margin-top:8px;">BTC $${p.btc} ${p.btcChg>0?'▲':'▼'}${Math.abs(p.btcChg).toFixed(1)}% · ETH $${p.eth} ${p.ethChg>0?'▲':'▼'}${Math.abs(p.ethChg).toFixed(1)}% · SOL $${p.sol} ${p.solChg>0?'▲':'▼'}${Math.abs(p.solChg).toFixed(1)}%</div>`;
  document.body.insertAdjacentHTML('afterbegin', html);
}

/* ---------- sim tick ---------- */
let simInterval = null;
function simTick() {
  if (simInterval) clearInterval(simInterval);
  simInterval = setInterval(() => {
    // network metrics random walk
    if (state.network) {
      state.network.totalVolume = Math.max(0, state.network.totalVolume + (Math.random()-0.5)*1000000);
      state.network.activeAgents = Math.max(0, Math.min(50000, state.network.activeAgents + (Math.random()-0.5)*200));
      state.network.avgExecution = Math.max(0.1, state.network.avgExecution + (Math.random()-0.5)*0.1);
      state.network.successRate = Math.max(50, Math.min(99.9, state.network.successRate + (Math.random()-0.5)*0.5));
    }
    if (state.feed) {
      state.feed.unshift(`Block ${Math.floor(Math.random()*999999)} • ${Math.random()>0.5?'tx':'mint'} • $${(Math.random()*1000).toFixed(0)}`);
      if (state.feed.length > 8) state.feed.pop();
    }
    renderOverviewMetrics();
    renderRegistryTable();
    renderTreasuryFlow();
    renderSecurityLayers();
    renderTokenDonut();
    renderStrxPrice();
  }, 1000);
}
function startSim() { if (!simInterval) simTick(); }

/* ---------- render: overview metrics ---------- */
function renderOverviewMetrics() {
  const el = document.getElementById('overview-metrics');
  if (!el) return;
  const n = state.network;
  el.innerHTML = `<div style="font-size:14px;margin-bottom:12px;">
    <span style="color:#00C805;">${n.activeAgents.toLocaleString()} Active Agents</span> ·
    <span style="color:#2EDA12;">${n.totalVolume.toLocaleString()} Volume</span> ·
    <span style="color:#00C805;">${n.avgExecution.toFixed(1)}s Avg Exec</span> ·
    <span style="color:#FF5000;">${n.successRate.toFixed(1)}% Success</span>
  </div>` + `<div id="overview-feed" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8B9E;"></div>`;
}
function renderOverviewFeed() {
  const el = document.getElementById('overview-feed');
  if (!el) return;
  const arr = state.feed || [];
  el.innerHTML = arr.slice(0,6).map(f => `<div style="margin:4px 0;">${f}</div>`).join('');
}

/* ---------- render: registry table ---------- */
function renderRegistryTable() {
  const el = document.getElementById('registry-table');
  if (!el) return;
  const arr = state.registry || [];
  const filter = document.getElementById('registry-filter')?.value?.toLowerCase() || '';
  const rows = arr.filter(r => r.name.toLowerCase().includes(filter) || r.type.toLowerCase().includes(filter));
  el.innerHTML = `
    <table>
      <thead><tr><th>Name</th><th>Type</th><th>Rep</th><th>Volume</th><th>Status</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${r.name}</td><td>${r.type}</td><td style="color:#${r.rep>=90?'00C800':r.rep>=70?'FF9900':'FF5000'}">${r.rep}%</td><td>$${r.volume.toLocaleString()}</td><td><span class="pill ${r.active?'live':'warning'}">${r.active?'Active':'Inactive'}</span></td></tr>`).join('')}
      </tbody>
    </table>`;
}

/* ---------- render: treasury flow ---------- */
function renderTreasuryFlow() {
  const el = document.getElementById('treasury-flow');
  if (!el) return;
  const fee = state.fee || 0.25;
  const treasury = (fee * 100) * 0.4; // simplified
  const stakers = treasury * 0.3;
  const buyback = treasury * 0.3;
  el.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
      <div style="background:rgba(0,200,5,.1);border:1px solid rgba(0,200,5,.3);border-radius:12px;padding:16px;">
        <div style="font-size:10px;color:#8A8B9E;margin-bottom:4px;">Commerce Volume Fee</div>
        <div style="font-size:24px;color:#00C805;">${(state.fee||0).toFixed(2)}%</div>
      </div>
      <div style="background:rgba(0,200,5,.1);border:1px solid rgba(0,200,5,.3);border-radius:12px;padding:16px;">
        <div style="font-size:10px;color:#8A8B9E;margin-bottom:4px;">Treasury (40%)</div>
        <div style="font-size:24px;color:#00C805;">${treasury.toFixed(2)}%</div>
      </div>
      <div style="background:rgba(255,153,0,.1);border:1px solid rgba(255,153,0,.3);border-radius:12px;padding:16px;">
        <div style="font-size:10px;color:#8A8B9E;margin-bottom:4px;">Buyback & Burn (30%)</div>
        <div style="font-size:24px;color:#FF9900;">${buyback.toFixed(2)}%</div>
      </div>
    </div>`;
}

/* ---------- render: security layers ---------- */
function renderSecurityLayers() {
  const el = document.getElementById('security-layers');
  if (!el) return;
  const layers = [
    { name: 'Account Abstraction (ERC-4337)', active: true, color: '#00C805' },
    { name: 'Dynamic Spending Policy', active: true, color: '#2EDA12' },
    { name: 'Transaction Simulation', active: true, color: '#00E5A0' },
    { name: 'Contract Audit', active: true, color: '#FF9900' },
    { name: 'Human-in-the-Loop', active: true, color: '#FF5000' }
  ];
  el.innerHTML = layers.map((l,i) => `
    <div style="padding:16px;border-left:4px solid ${l.color};background:rgba(13,31,13,.4);margin-bottom:12px;border-radius:8px;">
      <div style="font-size:12px;color:#00C805;margin-bottom:4px;">${l.name}</div>
      <div style="font-size:11px;color:#8A8B9E;">Status: <span class="pill ${l.active?'live':'warning'}">${l.active?'Active':'Inactive'}</span></div>
    </div>`).join('');
}

/* ---------- render: tokenomics donut ---------- */
function renderTokenDonut() {
  const el = document.getElementById('token-donut');
  if (!el) return;
  // 5 segments: Community 40 / Team 20 / Treasury 15 / Liquidity 15 / Early 10
  const segments = [40,20,15,15,10];
  const colors = ['#00C805','#2EDA12','#00E5A0','#FF9900','#FF5000'];
  let total = 0; segments.forEach(s=>total+=s);
  let start = -90;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','180'); svg.setAttribute('height','180'); svg.setAttribute('viewBox','0 0 180 180');
  for (let i = 0; i < segments.length; i++) {
    const end = start + (segments[i]/total)*360;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const largeArc = (end - start) > 180 ? 1 : 0;
    path.setAttribute('d', `M90,90 m0,-80 A80,80 0 ${largeArc},1 ${90+80*Math.cos((start+end)/2*Math.PI/180)},${90-80*Math.sin((start+end)/2*Math.PI/180)}`);
    path.setAttribute('stroke', colors[i]);
    path.setAttribute('stroke-width','10');
    path.setAttribute('fill','none');
    svg.appendChild(path);
    start = end;
  }
  // center text
  const center = document.createElementNS('http://www.w3.org/2000/svg','text');
  center.setAttribute('x','90'); center.setAttribute('y','90'); center.setAttribute('text-anchor','middle'); center.setAttribute('dominant-baseline','middle'); center.setAttribute('font-family','JetBrains Mono,monospace'); center.setAttribute('font-size','14px'); center.setAttribute('fill','#F5F5F7'); center.textContent = '1,000,000,000';
  svg.appendChild(center);
  el.innerHTML = '';
  el.appendChild(svg);
}

/* ---------- render: $STRX price proxy ---------- */
function renderStrxPrice() {
  const el = document.getElementById('strx-price');
  if (!el) return;
  // proxy: use a real CoinGecko id as $STRX proxy, e.g. the-open-network
  // For demo, just show a price from CoinGecko or a static proxy
  el.textContent = '$STRX proxy: loading…';
  // In production would fetch a specific proxy token or show last price
}

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded', () => {
  state = {
    prices: {btc:0,eth:0,sol:0,strx:0},
    network: { totalVolume: 2458763210, activeAgents: 12847, avgExecution: 0.3, successRate: 99.7, chg: '+8.2%' },
    registry: [
      { name: 'AlphaResearch', type: 'Research', rep: 98.4, volume: 84291, active: true },
      { name: 'VoltExec', type: 'Trading', rep: 97.1, volume: 412882, active: true },
      { name: 'GlyphForge', type: 'Design', rep: 96.5, volume: 22731, active: false },
      { name: 'LexArbiter', type: 'Legal', rep: 99.0, volume: 61120, active: true },
      { name: 'DataSpring', type: 'Data', rep: 99.1, volume: 138553, active: true },
      { name: 'SignalReach', type: 'Marketing', rep: 95.8, volume: 18904, active: true }
    ],
    feed: [],
    fee: 0.25
  };
  startSim();
  renderOverviewMetrics();
  renderOverviewFeed();
  renderRegistryTable();
  renderTreasuryFlow();
  renderSecurityLayers();
  renderTokenDonut();
  // $STRX proxy price — show last known or placeholder
  document.getElementById('strx-price').textContent = '$STRX proxy: $0.42 (CoinGecko proxy)';
});
</script>
</body>
</html>
