<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strix Hood — App</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- base reset ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; background: #0A0A0F; color: #F5F5F7; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  img, svg { max-width: 100%; height: auto; display: block; }
  /* ---------- grain overlay ---------- */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E %3Cfilter id='noise'%3E %3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E %3C/filter%3E %3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.03' /%3E %3C/svg%3E"); }
  /* ---------- custom cursor ---------- */
  #cur { width: 8px; height: 8px; background: #00C805; border-radius: 50%; position: fixed; pointer-events: none; mix-blend: difference; transition: width .15s, height .15s; z-index: 10000; }
  #cur:hover { width: 24px; height: 24px; }
  /* ---------- shell ---------- */
  .shell { width:100%; max-width:1280px; margin-inline:auto; padding-inline:clamp(20px,4vw,56px); }
  /* ---------- sidebar desktop ---------- */
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; border-right: 1px solid rgba(0,200,5,.1); backdrop-filter: blur(20px); padding: clamp(24px,6vw,40px) 0; }
  .sidebar .logo { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -.02em; color: #00C805; margin-bottom: 48px; display: block; }
  .logo .accent { color: #2EDA12; }
  .nav { display: flex; flex-direction: column; gap: 8px; }
  .nav-item { font-size: 14px; font-weight: 500; color: #8A8B9E; padding: 12px 16px; border-radius: 12px; transition: background .2s, color .2s; }
  .nav-item:hover, .nav-item.active { background: rgba(0,200,5,.1); color: #00C805; }
  /* ---------- bottom nav mobile ---------- */
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: #0D1F0D; backdrop-filter: blur(20px); display: none; }
  .bottom-nav .nav { display: flex; gap: 0; }
  .bottom-nav .nav-item { flex: 1; padding: 16px 0; text-align: center; font-size: 12px; font-weight: 600; color: #8A8B9E; border-top: 1px solid rgba(255,255,255,.05); }
  .bottom-nav .nav-item:hover, .bottom-nav .nav-item.active { color: #00C805; border-color: #00C805; }
  /* ---------- view containers ---------- */
  .view { display: none; }
  .view.active { display: block; }
  /* ---------- status pill ---------- */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 100px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .pill.live { background: rgba(0,200,5,.15); color: #00C805; border: 1px solid rgba(0,200,5,.3); }
  .pill.warning { background: rgba(255,153,0,.15); color: #FF9900; }
  .pill.error { background: rgba(255,80,0,.15); color: #FF5000; }
  /* ---------- glass card ---------- */
  .glass { background: rgba(13,31,13,.4); backdrop-filter: blur(20px); border: 1px solid rgba(0,200,5,.2); border-radius: 20px; padding: 32px; }
</style>
</head>
<body>
<div id="cur"></div>
<x-dc>
  <!-- sidebar desktop -->
  <div class="sidebar">
    <div class="logo"><span class="accent">STRIX</span> HOOD</div>
    <nav class="nav" role="navigation">
      <button class="nav-item active" data-view="overview">Overview</button>
      <button class="nav-item" data-view="agents">Agents</button>
      <button class="nav-item" data-view="portfolio">Portfolio</button>
      <button class="nav-item" data-view="transactions">Transactions</button>
      <button class="nav-item" data-view="policy">Policy</button>
      <button class="nav-item" data-view="settings">Settings</button>
    </nav>
  </div>
  <!-- bottom nav mobile -->
  <div class="bottom-nav">
    <div class="nav">
      <button class="nav-item active" data-view="overview">O</button>
      <button class="nav-item" data-view="agents">A</button>
      <button class="nav-item" data-view="portfolio">P</button>
      <button class="nav-item" data-view="transactions">T</button>
      <button class="nav-item" data-view="policy">P</button>
      <button class="nav-item" data-view="settings">S</button>
    </div>
  </div>
  <!-- template views -->
  <div class="view active" id="overview">
    <div class="shell">
      <h1>Strix Hood App</h1>
      <p class="pill live">Live</p>
      <div id="overview-feed"></div>
      <div id="overview-stats"></div>
    </div>
  </div>
  <div class="view" id="agents">
    <div class="shell">
      <h2>My Agents</h2>
      <div id="agents-grid"></div>
    </div>
  </div>
  <div class="view" id="portfolio">
    <div class="shell">
      <h2>Portfolio</h2>
      <div id="portfolio-donut"></div>
      <div id="holdings-list"></div>
      <div id="sparkline"></div>
    </div>
  </div>
  <div class="view" id="transactions">
    <div class="shell">
      <h2>Recent Transactions</h2>
      <table><thead><tr><th>Status</th><th>Hash</th><th>Arah</th><th>Jumlah</th><th>Waktu</th></tr></thead><tbody id="tx-body"></tbody></table>
    </div>
  </div>
  <div class="view" id="policy">
    <div class="shell">
      <h2>Policy Configurator</h2>
      <label>Daily limit: <input type="range" id="daily-limit" min="0" max="500" step="10" value="100"> <span id="daily-val">100</span></label>
      <label>Per-transaction: <input type="range" id="per-tx" min="0" max="100" step="10" value="30"> <span id="per-tx-val">30</span></label>
      <div id="policy-progress"></div>
      <div id="policy-toggles"></div>
    </div>
  </div>
  <div class="view" id="settings">
    <div class="shell">
      <h2>Settings</h2>
      <button id="connect-wallet" style="width:100%;padding:14px;margin-bottom:16px;background:#00C805;color:#0A0A0F;font-weight:600;border:none;border-radius:12px;font-family:'Space Grotesk',sans-serif;">Connect Wallet</button>
      <div id="wallet-status" style="margin-top:16px;font-size:12px;color:#8A8B9E;"></div>
      <label style="display:block;margin-top:24px;">
        <input type="checkbox" id="preloader" checked> Preloader
        <label style="margin-left:12px;font-size:12px;color:#8A8B9E;">Preloader</label>
      </label>
      <label style="display:block;margin-top:12px;">
        <input type="checkbox" id="customCursor" checked> Custom cursor
        <label style="margin-left:12px;font-size:12px;color:#8A8B9E;">Custom cursor</label>
      </label>
      <label style="display:block;margin-top:12px;">
        <input type="checkbox" id="particles" checked> Particles
        <label style="margin-left:12px;font-size:12px;color:#8A8B9E;">Particles</label>
      </label>
    </div>
  </div>
</x-dc>

<script>
/* ---------- helper: set active view ---------- */
function setView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(view).classList.add('active');
  document.querySelectorAll('.sidebar .nav-item, .bottom-nav .nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
}

/* ---------- sidebar / bottom nav click ---------- */
document.querySelectorAll('.sidebar .nav-item, .bottom-nav .nav-item').forEach(b => {
  b.addEventListener('click', () => setView(b.dataset.view));
});
setView('overview');

/* ---------- wallet connect (real) ---------- */
let wallet = null;
const walletStatus = document.getElementById('wallet-status');
const connectBtn = document.getElementById('connect-wallet');

async function connectWallet() {
  // EVM first
  if (window.ethereum) {
    try {
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      const addr = accounts[0];
      const r = await fetch('https://cloudflare-eth.com', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_getBalance', params: [addr, 'latest'] })
      });
      const j = await r.json();
      const balWei = parseInt(j.result, 16);
      const balEth = (balWei / 1e18).toFixed(4);
      wallet = { type: 'evm', addr: addr.slice(0,6)+'...'+addr.slice(-4), bal: balEth, chain: 'Ethereum' };
    } catch (e) { walletErr('Connection rejected'); return; }
  } else if (window.solana || window.phantom?.solana) {
    const sol = window.solana || window.phantom.solana;
    try { await sol.connect(); const addr = sol.publicKey.toString(); const r = await fetch('https://api.mainnet-beta.solana.com', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getBalance', params: [addr] }) }); const j = await r.json(); const balSol = j.result.value / 1e9; wallet = { type: 'solana', addr: addr.slice(0,6)+'...'+addr.slice(-4), bal: balSol.toFixed(4), chain: 'Solana' }; } catch (e) { walletErr('Connection rejected'); return; }
  } else { walletErr('No wallet detected. Install MetaMask or Phantom.'); return; }
  walletStatus.innerHTML = `Address: <span style="color:#F5F5F7;">${wallet.addr}</span> · <span style="color:#00C805;">${wallet.chain}</span> · Balance: <span style="color:#2EDA12;">${wallet.bal} ${wallet.chain === 'Ethereum' ? 'ETH' : 'SOL'}</span>`;
  walletStatus.style.display = 'block';
  // listen
  if (window.ethereum) { window.ethereum.on('accountsChanged', accounts => { wallet = null; walletStatus.style.display = 'none'; walletErr('Wallet disconnected'); }); }
  const sol = window.solana || window.phantom?.solana; if (sol?.on) { sol.on('disconnect', () => { wallet = null; walletStatus.style.display = 'none'; walletErr('Wallet disconnected'); }); }
}
function walletErr(msg) { walletStatus.innerHTML = `<span style="color:#FF5000;">${msg}</span>`; walletStatus.style.display = 'block'; }

connectBtn.addEventListener('click', connectWallet);

/* ---------- helpers ---------- */
function walletErr(msg) { walletStatus.innerHTML = `<span style="color:#FF5000;">${msg}</span>`; walletStatus.style.display = 'block'; }

/* ---------- view switching + data load ---------- */
async function loadOverview() {
  await fetchPrices();
  simTick();
  renderOverviewFeed();
  renderOverviewStats();
}
async function loadAgents() { renderAgentsGrid(); }
async function loadPortfolio() { renderPortfolioDonut(); renderHoldings(); renderSparkline(); }
async function loadTransactions() { renderTxTable(); }
async function loadPolicy() { renderPolicyControls(); }
async function loadSettings() { /* state already in DOM */ }

/* ---------- CoinGecko fetch ---------- */
async function fetchPrices() {
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true');
    const j = await r.json();
    state.prices = { btc: j.bitcoin.usd, eth: j.ethereum.usd, sol: j.solana.usd, btcChg: j.bitcoin.usd_24h_change, ethChg: j.ethereum.usd_24h_change, solChg: j.solana.usd_24h_change };
    renderPrices();
  } catch(e) { /* keep last */ }
}
function renderPrices() {
  const p = state.prices;
  // simple inline render — append to overview or header
  const html = `<div style="font-size:12px;color:#8A8B9E;">BTC $${p.btc} ${p.btcChg>0?'▲':'▼'}${Math.abs(p.btcChg).toFixed(1)}% · ETH $${p.eth} ${p.ethChg>0?'▲':'▼'}${Math.abs(p.ethChg).toFixed(1)}% · SOL $${p.sol} ${p.solChg>0?'▲':'▼'}${Math.abs(p.solChg).toFixed(1)}%</div>`;
  document.body.insertAdjacentHTML('afterbegin', html);
}

/* ---------- sim tick ---------- */
let simInterval = null;
function simTick() {
  if (simInterval) clearInterval(simInterval);
  simInterval = setInterval(() => {
    // random walk: volume, agent count, activity feed
    if (state.txFeed) state.txFeed.unshift(`TX #${Math.floor(Math.random()*9999)+1} • ${Math.random()>0.5?'buy':'sell'} • $${(Math.random()*1000).toFixed(0)}`);
    if (state.txFeed.length > 10) state.txFeed.pop();
    renderOverviewFeed();
    renderTxTable();
  }, 1000);
}
function startSim() { if (!simInterval) simTick(); }

/* ---------- render functions ---------- */
function renderOverviewFeed() {
  const el = document.getElementById('overview-feed');
  if (!el) return;
  const arr = state.txFeed || [];
  el.innerHTML = arr.slice(0,8).map(t => `<div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#8A8B9E;margin:4px 0;">${t}</div>`).join('');
}
function renderOverviewStats() {
  const el = document.getElementById('overview-stats');
  if (!el) return;
  const avg = (state.txFeed?.length || 0) * 0.3;
  el.innerHTML = `<div style="font-size:14px;">Avg exec: ${avg.toFixed(1)}s · Success: 99.7% · Monthly: $${(Math.random()*10000).toFixed(0)}</div>`;
}
function renderAgentsGrid() {
  const el = document.getElementById('agents-grid');
  if (!el) return;
  el.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">
      <div style="background:rgba(13,31,13,.4);border:1px solid rgba(0,200,5,.2);border-radius:16px;padding:20px;">
        <h3 style="color:#00C805;">AlphaResearch</h3>
        <p style="color:#8A8B9E;">Rep: 98.4 | Vol: $84,291</p>
      </div>
      <div style="background:rgba(13,31,13,.4);border:1px solid rgba(0,200,5,.2);border-radius:16px;padding:20px;">
        <h3 style="color:#FF5000;">VoltExec</h3>
        <p style="color:#8A8B9E;">Rep: 97.1 | Vol: $412,882</p>
      </div>
    </div>`;
}
function renderPortfolioDonut() {
  const el = document.getElementById('portfolio-donut');
  if (!el) return;
  el.innerHTML = `<svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" stroke="rgba(0,200,5,.15)" stroke-width="10" fill="none"/><circle cx="90" cy="90" r="80" stroke-width="10" fill="transparent" stroke-dasharray="430" stroke-dashoffset="0" style="stroke:#00C805;transform:rotate(-90deg)"/><text x="90" y="90" dominant-baseline="middle" text-anchor="middle" font-family:'JetBrains Mono',monospace;font-size:12px;color:#F5F5F7;">$0</text></svg>`;
}
function renderHoldings() {
  const el = document.getElementById('holdings-list');
  if (!el) return;
  el.innerHTML = `<div style="font-size:12px;color:#8A8B9E;">BTC: 1.234 BTC · $45,678 · +2.1%<br>ETH: 12.3 ETH · $2,345 · -1.3%<br>SOL: 45.6 SOL · $1,234 · +3.5%</div>`;
}
function renderSparkline() {
  const el = document.getElementById('sparkline');
  if (!el) return;
  el.innerHTML = `<canvas width="180" height="60"></canvas>`;
  const c = el.querySelector('canvas'); const ctx = c.getContext('2d');
  const data = [10,20,15,25,30,28,22]; // dummy
  ctx.beginPath(); ctx.moveTo(0,data[0]); for(let i=1;i<data.length;i++) ctx.lineTo(i,data[i]); ctx.strokeStyle='#00C805'; ctx.lineWidth=2; ctx.stroke();
}
function renderTxTable() {
  const el = document.getElementById('tx-body');
  if (!el) return;
  const arr = state.txFeed || [];
  el.innerHTML = arr.slice(0,6).map(t => `<tr style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#8A8B9E;"><td><span class="pill ${Math.random()>0.5?'live':'warning'}">${Math.random()>0.5?'Live':'Warning'}</span></td><td>0x${Math.random().toString(16).slice(2,8)}...</td><td>${Math.random()>0.5?'Buy':'Sell'</td><td>$${Math.random()*100}</td><td>${Math.floor(Math.random()*86400)}s ago</td></tr>`).join('');
}

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded', () => {
  state = { prices: {btc:0,eth:0,sol:0,strx:0}, holdings: {}, agents: [], txFeed: [], policy: { daily:100, perTx:30 }, wallet: null };
  startSim();
  loadOverview();
});
</script>
</body>
</html>
